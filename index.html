<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/companyflow.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>try{if(localStorage.getItem("companyflow-theme")==="light")document.documentElement.classList.add("light")}catch(e){}</script>
    <title>CompanyFlow | Custom Software, Websites, ERP & CRM</title>
    <meta name="description" content="CompanyFlow designs and develops custom software, business websites, e-commerce stores, ERP and CRM systems, and AI automation for growing businesses." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://www.companyflow.co.uk/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CompanyFlow" />
    <meta property="og:title" content="CompanyFlow | Custom Software, Websites, ERP & CRM" />
    <meta property="og:description" content="Practical software, thoughtful design, and digital experiences built around the way your business works." />
    <meta property="og:url" content="https://www.companyflow.co.uk/" />
    <meta property="og:image" content="https://www.companyflow.co.uk/hero-team.webp" />
    <meta property="og:image:alt" content="CompanyFlow digital product and software development" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CompanyFlow | Custom Software, Websites, ERP & CRM" />
    <meta name="twitter:description" content="Practical software, thoughtful design, and digital experiences built around the way your business works." />
    <meta name="twitter:image" content="https://www.companyflow.co.uk/hero-team.webp" />
    <meta name="theme-color" content="#0a0a0a" />
    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"CompanyFlow","url":"https://www.companyflow.co.uk/","email":"companyflow0@gmail.com","address":{"@type":"PostalAddress","addressLocality":"Birmingham","addressCountry":"GB"},"description":"CompanyFlow designs and develops custom software, business websites, e-commerce stores, ERP and CRM systems, and AI automation."}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400;1,600&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Netlify Forms discovery: these static forms make the React forms discoverable at build time. -->
    <div hidden aria-hidden="true">
      <form name="contact-form" method="POST" data-netlify="true" netlify-honeypot="bot-field">
        <input type="hidden" name="form-name" value="contact-form" />
        <input name="bot-field" />
        <input name="name" /><input name="email" /><input name="company" />
        <input name="budget" /><input name="type" /><textarea name="message"></textarea>
      </form>
      <form name="job-application" method="POST" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data">
        <input type="hidden" name="form-name" value="job-application" />
        <input name="bot-field" /><input name="job-title" /><input name="name" />
        <input name="email" /><input name="phone" /><input name="portfolio" />
        <input name="resume" type="file" /><textarea name="cover-note"></textarea>
      </form>
      <form name="newsletter-form" method="POST" data-netlify="true" netlify-honeypot="bot-field">
        <input type="hidden" name="form-name" value="newsletter-form" />
        <input name="bot-field" /><input name="email" type="email" />
      </form>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
